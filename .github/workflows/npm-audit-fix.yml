name: NPM Audit Fix

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: npm-audit-fix
  cancel-in-progress: false

jobs:
  npm-audit-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check audit fix token
        shell: bash
        env:
          NPM_AUDIT_FIX_TOKEN: ${{ secrets.NPM_AUDIT_FIX_TOKEN }}
        run: |
          if [[ -z "$NPM_AUDIT_FIX_TOKEN" ]]; then
            echo "::error::Add the NPM_AUDIT_FIX_TOKEN Actions secret with Contents and Pull requests write access to this repository."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit fix
        run: npm run audit-fix

      - name: Run lint
        run: npm run lint --if-present

      - name: Run tests
        run: npm test --if-present

      - name: Run build
        run: npm run build --if-present

      - name: Run type check
        run: npm run typecheck --if-present

      # The action detects changes itself. Run even without changes so it can
      # close obsolete PRs and clean up the branch after a previous merge.
      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.NPM_AUDIT_FIX_TOKEN }}
          add-paths: |
            package.json
            package-lock.json
          commit-message: |
            chore: npm audit fix

            Co-authored-by: Codex <noreply@openai.com>
          title: "chore: npm audit fix"
          body: |
            Automated npm audit fix.

            This PR was created automatically by the NPM Audit Fix workflow.

            - Dependencies were installed with `npm ci`
            - `npm run audit-fix` applied compatible updates without `--force`
            - Remaining vulnerabilities are reported in the workflow log and may require manual updates
            - Lint, tests, build, and type checks were run if their scripts exist

            Workflow: ${{ github.workflow }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Co-authored-by: Codex <noreply@openai.com>
          branch: chore/npm-audit-fix
          base: ${{ github.event.repository.default_branch }}
          delete-branch: true
          labels: dependencies,security
